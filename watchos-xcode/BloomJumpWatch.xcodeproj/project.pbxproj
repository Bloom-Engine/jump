			shellScript = "set -e\ncd \"${PROJECT_DIR}/..\"\n\n# Map Xcode's SDK → Perry target. Xcode uses `watchos` for device builds\n# and `watchsimulator` for the simulator; Perry uses `watchos` / `watchos-simulator`.\ncase \"${PLATFORM_NAME}\" in\n  watchos)          PERRY_TARGET=watchos ;;\n  watchsimulator)   PERRY_TARGET=watchos-simulator ;;\n  *) echo \"error: unsupported PLATFORM_NAME='${PLATFORM_NAME}'\" >&2; exit 1 ;;\nesac\n\n# Match Perry's link triple min-OS to Xcode's deployment target so the\n# resulting binary's LC_BUILD_VERSION doesn't mismatch the watch at install\n# time (\"watchOS doesn't match ... deployment target\").\nexport PERRY_WATCHOS_MIN=\"${WATCHOS_DEPLOYMENT_TARGET}\"\n\n# Compile with Perry (emits BloomJumpWatch.app at repo root).\nperry compile --target \"${PERRY_TARGET}\" --features watchos-swift-app src/main.ts -o BloomJumpWatch 2>&1\n\n# Copy assets into the bundle.\ncp -R assets BloomJumpWatch.app/ 2>/dev/null || true\n\n# Hand the executable + assets + metallib off to Xcode. Xcode owns the\n# bundle dir (it generates Info.plist from Info-stub.plist with correct\n# CFBundleIdentifier) and will sign everything afterward. Don't overwrite\n# the Info.plist Xcode is about to process.\nmkdir -p \"${BUILT_PRODUCTS_DIR}/BloomJumpWatch.app\"\ncp BloomJumpWatch.app/BloomJumpWatch \"${BUILT_PRODUCTS_DIR}/BloomJumpWatch.app/\"\nif [ -f BloomJumpWatch.app/default.metallib ]; then\n  cp BloomJumpWatch.app/default.metallib \"${BUILT_PRODUCTS_DIR}/BloomJumpWatch.app/\"\nfi\nrm -rf \"${BUILT_PRODUCTS_DIR}/BloomJumpWatch.app/assets\"\ncp -R BloomJumpWatch.app/assets \"${BUILT_PRODUCTS_DIR}/BloomJumpWatch.app/\" 2>/dev/null || true\n";
